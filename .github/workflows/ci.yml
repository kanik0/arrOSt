name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy xtask
        run: cargo clippy -p xtask --all-targets -- -D warnings

      - name: Test xtask
        run: cargo test -p xtask

      - name: Test arrostd
        run: cargo test -p arrostd

  checks-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, clippy
          targets: x86_64-unknown-none

      - name: Clippy kernel x86_64
        run: cargo clippy -p arrost-kernel --target x86_64-unknown-none -Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem

  checks-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Build kernel aarch64
        run: cargo build -p arrost-kernel --target aarch64-unknown-none -Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem

      - name: Build UEFI loader aarch64
        run: cargo build -p arrost-aarch64-uefi-loader --target aarch64-unknown-uefi

  doom-smoke-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - checks-host
      - checks-x86_64
      - checks-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf lsof clang

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none,aarch64-unknown-none,aarch64-unknown-uefi

      - name: Vendor DoomGeneric Sources
        run: bash scripts/vendor_doomgeneric.sh

      - name: Build Image
        run: cargo xtask build

      - name: Smoke DOOM x86_64
        run: timeout 180s cargo xtask smoke-doom --arch x86_64

      - name: Smoke Ring3 x86_64
        run: timeout 120s cargo xtask smoke-ring3 --arch x86_64

  doom-smoke-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - checks-host
      - checks-x86_64
      - checks-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 lsof clang

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none,aarch64-unknown-none,aarch64-unknown-uefi

      - name: Vendor DoomGeneric Sources
        run: bash scripts/vendor_doomgeneric.sh

      - name: Build Image
        run: cargo xtask build

      - name: Smoke DOOM aarch64
        run: timeout 180s cargo xtask smoke-doom --arch aarch64

      - name: Smoke Ring3 aarch64
        run: timeout 120s cargo xtask smoke-ring3 --arch aarch64

      - name: Smoke Ring3 Fault aarch64
        run: timeout 180s cargo xtask smoke-ring3-fault --arch aarch64
